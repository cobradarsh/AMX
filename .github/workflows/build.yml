name: Build AMScreen

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Xcode's toolchain is required: only it emits the new arm64e ABI that
    # SpringBoard on iOS 14+ will load. The Linux toolchain emits the old ABI.
    # Intel runner: the arm64 macOS pool is often capacity-constrained.
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: src

      - name: Install build tools
        run: brew install ldid make dpkg xz

      - name: Install Theos and the roothide Theos fork
        run: |
          git clone --recursive --depth=1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
          git clone --recursive --depth=1 https://github.com/roothide/theos.git "$RUNNER_TEMP/theos-roothide"

      - name: Build rootless package (Dopamine)
        working-directory: src
        run: gmake clean package FINALPACKAGE=1 THEOS="$RUNNER_TEMP/theos" THEOS_PACKAGE_SCHEME=rootless

      - name: Build roothide package (Dopamine-roothide)
        continue-on-error: true
        working-directory: src
        run: gmake clean package FINALPACKAGE=1 THEOS="$RUNNER_TEMP/theos-roothide" THEOS_PACKAGE_SCHEME=roothide

      - name: Show arm64e ABI of each package
        working-directory: src
        run: |
          for deb in packages/*.deb; do
            rm -rf /tmp/x && mkdir /tmp/x && dpkg-deb -x "$deb" /tmp/x
            echo "== $deb"
            lipo -detailed_info "$(find /tmp/x -name AMScreen.dylib)"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: AMScreen-rootless
          path: src/packages/*_iphoneos-arm64.deb

      - uses: actions/upload-artifact@v4
        with:
          name: AMScreen-roothide
          path: src/packages/*_iphoneos-arm64e.deb
          if-no-files-found: warn

      - name: Attach .deb to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src/packages/*.deb
