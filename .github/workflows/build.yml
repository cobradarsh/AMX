name: Build AMScreen

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - uses: actions/checkout@v4
        with:
          path: src

      - name: Install Theos, the iOS toolchain and an SDK
        run: bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"

      - name: Show installed SDKs
        run: ls "$THEOS/sdks"

      - name: Build rootless package
        working-directory: src
        run: make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - uses: actions/upload-artifact@v4
        with:
          name: AMScreen-deb
          path: src/packages/*.deb
